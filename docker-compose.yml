services:
  mysql:
    image: mysql:8.4
    container_name: projekt_mysql
    command: --host-cache-size=0
    environment:
      MYSQL_DATABASE: projektdb
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_USER: projektuser
      MYSQL_PASSWORD: projektpassword
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - projekt_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  laravel:
    build:
      context: ./backend
      dockerfile: ../docker/php/Dockerfile
    container_name: projekt_backend
    user: "www-data"
    volumes:
      - ./backend:/var/www/html
      - /var/www/html/vendor
      - ./docker/php/uploads.ini:/usr/local/etc/php/conf.d/uploads.ini
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost
      DB_CONNECTION: mysql
      DB_HOST: projekt_mysql
      DB_PORT: 3306
      DB_DATABASE: projektdb
      DB_USERNAME: projektuser
      DB_PASSWORD: projektpassword
      FRONTEND_URL: http://localhost:4200
      SESSION_DRIVER: database
      SESSION_LIFETIME: 43200
      SESSION_ENCRYPT: "true"
      SESSION_PATH: /
      SESSION_DOMAIN: localhost
      SESSION_SECURE_COOKIE: "false"
      SANCTUM_STATEFUL_DOMAINS: localhost,localhost:80,127.0.0.1,192.168.1.147
      SESSION_HTTP_ONLY: "true"
      SESSION_SAME_SITE: lax

    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - projekt_network

  angular:
    build:
      context: ./frontend
      dockerfile: ../docker/angular/Dockerfile
    container_name: projekt_frontend
    ports:
      - "4200:4200"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      laravel:
        condition: service_started
    networks:
      - projekt_network

  nginx:
    image: nginx:stable-alpine
    container_name: projekt_nginx
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
      - ./backend:/var/www/html
    depends_on:
      laravel:
        condition: service_started
      angular:
        condition: service_started
    networks:
      - projekt_network
  phpmyadmin:
    image: phpmyadmin:latest
    container_name: projekt_phpmyadmin
    volumes:
      - ./docker/phpmyadmin/servername.conf:/etc/apache2/conf-enabled/servername.conf:ro
    environment:
      PMA_HOST: projekt_mysql
      PMA_USER: root
      PMA_PASSWORD: rootpassword
    ports:
      - "8080:80"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - projekt_network

volumes:
  mysql_data:

networks:
  projekt_network:
    driver: bridge
